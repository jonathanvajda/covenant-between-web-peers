# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-query-whom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/query-whom/package-lock.json
      - name: Install fixed development dependencies
        run: npm ci --ignore-scripts
        working-directory: docs/query-whom
      - name: Validate generated RDF and offline assets
        run: npm run check
        working-directory: docs/query-whom
      - name: Test Query Whom and shared engine
        run: |
          npm test --prefix docs/query-whom
          npm test --prefix docs/packages/game-mechanics
      - name: Audit fixed dependencies
        run: npm audit --audit-level=high
        working-directory: docs/query-whom
      - name: Install browser for accessibility and offline checks
        run: npx playwright install --with-deps chromium
        working-directory: docs/query-whom
      - name: Test browser gameplay and accessibility
        run: npm run test:browser
        working-directory: docs/query-whom
  # Single deploy job since we're just deploying
  deploy:
    needs: validate-query-whom
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
